<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RBPS Widget</title>
</head>
<body>
    <div id="widget-container">
        <div id="coin-sack">
            <img id="coin-sack-img" src="../assets/ui/coin-sack.png" alt="💰">
        </div>
        <div id="point-display">
            <div id="points">Points: 0</div>
            <div id="multiplier">Multiplier: x1</div> 
        </div>
    </div>
    <script> 

        function showFloatingPoints(amount){
            const floating = document.createElement('div');
            floating.classList.add('floating-points')
            floating.textContent = `+${amount}`
            document.getElementById('coin-sack').appendChild(floating);

            floating.addEventListener('animationend', () => {
                floating.remove();
            })
        }

        function showSpendingPoints(amount){
            const spending = document.createElement('div');
            spending.classList.add('spending-points')
            spending.textContent = `-${amount}`
            document.getElementById('coin-sack').appendChild(spending);

            spending.addEventListener('animationend', () => {
                spending.remove();
            })
        }

        const socket = new WebSocket('ws://localhost:8080');
                                    
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.points !== undefined && data.type === 'points'){
                document.getElementById('points').textContent = `Points: ${data.points}`;
                document.getElementById('multiplier').textContent = `Multiplier: x${data.multiplier}`;
                showFloatingPoints(data.gained);
            }

            if (data.spent) {
                showSpendingPoints(data.spent)
            }
            
            if (data.sound) {
                const audio = new Audio(`../sounds/sound-board/${data.sound}.mp3`);
                audio.play();
            }

            if (data.milestone) {
                const milestone = new Audio(`../sounds/${data.milestone}`);
                milestone.play();
            }

            if (data.spendSound) {
                const spend = new Audio(`../sounds/${data.spendSound}.mp3`);
                spend.play();
            }
        }
    </script>
</body>
</html>
