<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character</title>
</head>
<body>
    <img id="haruki" src="../assets/skins/Zuko-Haruki.png" alt="🎮" onerror="this.style.display='none'"></img>
    <div id="speech-bubble" style="display:none"></div>

    <script>
        const socket = new WebSocket('ws://localhost:8080');
        
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'skin') {
                document.getElementById('haruki').src=`../assets/skins/${data.skin}.png`
            }
        }
    </script>
</body>
</html>
